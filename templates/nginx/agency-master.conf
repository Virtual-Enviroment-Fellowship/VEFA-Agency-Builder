server {
    listen 80 default_server;
    listen 443 ssl http2 default_server;
    
    server_name _; 

    root /var/www/master-app/public;
    index index.php;

    ssl_certificate /etc/nginx/ssl/agency-master.crt;
    ssl_certificate_key /etc/nginx/ssl/agency-master.key;

    # 1. Front Controller Pattern (The Slim PHP Router)
    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    # 2. PHP-FPM Processing (The Single Pool)
    location ~ \.php$ {
        try_files $uri =404;
        
        # Point to the single optimized worker pool
        fastcgi_pass unix:/run/php/php8.3-fpm-agency-master.sock;
        
        fastcgi_index index.php;
        include fastcgi_params;
        
        # CRITICAL: Pass the domain requested so PHP knows which tenant to load
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_HOST $host; 
        fastcgi_param SERVER_NAME $host;
    }

    # 3. Security
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
